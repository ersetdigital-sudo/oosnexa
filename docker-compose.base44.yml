services:
  web:
    image: node:22
    working_dir: /app
    command:
      - sh
      - -ec
      - npm ci --no-audit --no-fund && exec npm run dev -- --hostname 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    volumes:
      # Source is bind-mounted so edits show up live; node_modules lives in a
      # named volume so the host copy (whatever platform it came from) is masked.
      - ./:/app
      - node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      # Bind mounts need polling for the watcher to notice edits.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      # Consumed by next.config.ts (allowedDevOrigins) — never hardcode the value.
      BASE44_PUBLIC_HOST_SUFFIX: ${BASE44_PUBLIC_HOST_SUFFIX}
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    restart: on-failure

volumes:
  node_modules:
